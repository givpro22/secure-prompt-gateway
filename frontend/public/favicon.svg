<!--
  PRISM 마크 — 육각형 + 자물쇠.

  탭 파비콘은 16px까지 줄어든다. 그 크기에서 테두리만 있는 육각형은 선이 사라지므로
  **속을 채운다.** 자물쇠는 흰색으로 파서 밝은 탭과 어두운 탭 어디서든 읽힌다.
  로고의 색 순서(왼쪽 위 남색 → 오른쪽 초록)는 그대로 가져왔다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a6e" />
      <stop offset="45%" stop-color="#1f8fc9" />
      <stop offset="100%" stop-color="#25b573" />
    </linearGradient>
  </defs>
  <path d="M16 1.6 28.5 8.8v14.4L16 30.4 3.5 23.2V8.8Z" fill="url(#g)" />
  <!-- 자물쇠. 고리는 선으로, 몸통은 면으로 — 작은 크기에서 형태가 안 무너진다 -->
  <path d="M12.6 15.2v-2.4a3.4 3.4 0 0 1 6.8 0v2.4"
        fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" />
  <rect x="10.7" y="15" width="10.6" height="8.2" rx="1.6" fill="#fff" />
  <circle cx="16" cy="18.5" r="1.35" fill="url(#g)" />
  <rect x="15.25" y="18.4" width="1.5" height="2.9" rx="0.75" fill="url(#g)" />
</svg>
