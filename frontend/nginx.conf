server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker 내장 DNS. proxy_pass에 호스트명을 그대로 쓰면 nginx가 기동 시점에 이름을 풀고,
    # 백엔드가 아직 없거나 죽어 있으면 nginx까지 기동 실패해 화면 자체가 안 뜬다.
    # 변수로 넘겨 요청 시점에 풀게 하면 그 경우 502만 나고 화면은 살아 있다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8080";

    # 라우터가 createWebHistory라 /admin/audit 직접 접근·새로고침이 404가 되면 안 된다
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API를 같은 오리진으로 받아 브라우저가 CORS를 타지 않게 한다
    location /api/v1/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI Mock 지연(기본 2.5s)과 202 폴링을 감안한 여유
        proxy_read_timeout 60s;
    }

    # 데모에서 API 명세를 바로 열 수 있게 springdoc도 같은 포트로 노출한다
    location /swagger-ui/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }
}
