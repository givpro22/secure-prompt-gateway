# EC2 단일 인스턴스 배포용. 외부에 여는 포트는 80뿐이고 DB·백엔드는 내부 네트워크에만 있다.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    # 백엔드가 Flyway 마이그레이션을 먼저 돌리므로 DB가 준비되기 전에 뜨면 부팅에 실패한다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    # GitHub Actions가 밀어 넣은 이미지를 서버는 받기만 한다 (.github/workflows/ci-cd.yml).
    # 로컬에서 `docker compose build`를 하면 같은 이름으로 태깅되므로 이 파일 하나로
    # 개발과 배포를 겸한다. 롤백은 IMAGE_TAG=<커밋 SHA> docker compose up -d.
    image: ghcr.io/givpro22/secure-prompt-gateway-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/gateway
      DB_USER: gateway
      DB_PASSWORD: ${DB_PASSWORD}
      # 답변 받기(UC-08). 서버 .env에 ANTHROPIC_API_KEY를 넣으면 켜지고, 비우면 꺼진다.
      # 코드 변경 없이 환경변수로 켜고 끈다 — Security & Config Isolation.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-claude}
      ANSWER_ENDPOINT: ${ANSWER_ENDPOINT:-}
      ANSWER_MODEL: ${ANSWER_MODEL:-claude-opus-5}
      ANSWER_API_KEY: ${ANSWER_API_KEY:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mock}
      # nginx가 같은 오리진에서 프록시하므로 실제로는 CORS를 타지 않지만,
      # 백엔드를 직접 호출하는 Postman·로컬 개발을 위해 값은 남겨 둔다
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/givpro22/secure-prompt-gateway-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    ports:
      # 로컬에서 80이 이미 쓰이면 HTTP_PORT=8088 처럼 바꿔 띄운다. EC2에서는 기본값 80
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
