name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 배포가 겹치면 EC2에서 서로 다른 커밋이 뒤섞인다. 같은 브랜치의 이전 실행은 취소한다.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend-test:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    # @SpringBootTest가 실제 DB에 붙는다. application.yml 기본값(localhost:55432,
    # gateway/gateway)에 맞춰 서비스 컨테이너를 띄운다 — 테스트 쪽 설정을 따로 두지 않는다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gateway
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 테스트 실행
        working-directory: backend
        run: ./gradlew --no-daemon test

      # 실패했을 때 어느 데모 케이스가 깨졌는지 로그만으로는 안 보인다
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend-build:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # 배포 이미지와 같은 값으로 빌드해 "로컬은 되는데 배포만 깨지는" 경우를 없앤다
      - name: 빌드
        working-directory: frontend
        env:
          VITE_API_BASE: /api/v1
        run: npm run build

  images:
    name: 이미지 빌드·푸시
    needs: [backend-test, frontend-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: GHCR 로그인
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # latest는 배포가 쓰고, SHA 태그는 롤백이 쓴다
      # (서버에서 IMAGE_TAG=<sha> docker compose up -d)
      - name: 빌드·푸시
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_PREFIX}-${{ matrix.name }}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" "${{ matrix.context }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  deploy:
    name: EC2 배포
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: 시크릿 확인
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "::error::EC2_HOST 시크릿이 없습니다"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "::error::EC2_SSH_KEY 시크릿이 없습니다"; exit 1; }

      # EC2는 이미지를 받아 재기동만 한다. 1GiB 인스턴스에서 Gradle·npm 빌드를 돌리면
      # 스왑을 다 쓰고도 OOM으로 죽는다 — 빌드는 러너가, 서버는 pull만.
      - name: 배포
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 토큰을 원격 명령줄에 두면 서버의 ps에 노출된다. stdin으로만 보낸다.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "ubuntu@$EC2_HOST" 'bash -s' <<EOF
          set -euo pipefail
          cd ~/secure-prompt-gateway
          git fetch --quiet origin main
          git reset --hard --quiet origin/main
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          docker compose pull
          docker compose up -d
          docker logout ghcr.io
          docker image prune -f
          EOF

      # 컨테이너가 떴다는 것과 화면이 뜬다는 것은 다르다. 여기서 실패하면 배포도 실패다.
      - name: 헬스 체크
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://$EC2_HOST/api/v1/departments"; then
              echo "API 응답 확인"
              curl -fsS -o /dev/null "http://$EC2_HOST/chat" && echo "화면 응답 확인"
              exit 0
            fi
            sleep 5
          done
          echo "::error::배포 후 150초 동안 http://$EC2_HOST 가 응답하지 않았습니다"
          exit 1
