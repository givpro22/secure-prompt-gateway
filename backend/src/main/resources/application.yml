spring:
  application:
    name: gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    # always: 기획서 8.4가 "submittedText": null, "decidedBy": null, "reviewedAt": null 을
    # 명시적으로 싣는다. non_null이면 이 필드들이 응답에서 사라져 FE가 "필드 없음"과 "null"을
    # 구분하는 방어 코드를 쓰게 된다 (계약서 §0 C3)
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}

# --- AI 확장 지점 (기획서 11.3) — 키·모델·지연은 전부 환경변수 ---
ai:
  provider: ${AI_PROVIDER:mock}          # mock | llm
  # llm 프로파일 전용. 사내망 Ollama를 가리키므로 외부로 나가는 요청이 없다 (교수 피드백 F3).
  endpoint: ${AI_ENDPOINT:http://localhost:11434/api/chat}
  api-key: ${AI_API_KEY:}
  # qwen3.5:2b는 골든셋 22/42(오탐 14)로 탈락했다. 7b가 하한이다 (_workspace/05 §1-5).
  model: ${AI_MODEL:qwen2.5:7b-instruct}
  temperature: ${AI_TEMPERATURE:0}
  max-tokens: ${AI_MAX_TOKENS:800}
  # 7b 배치 1회가 약 9초다. 10초로 두면 첫 호출(모델 로딩)에서 타임아웃이 난다
  timeout-ms: ${AI_TIMEOUT_MS:60000}
  max-input-chars: ${AI_MAX_INPUT_CHARS:4000}
  # 한 호출에 문장 하나. 여러 개를 묶으면 같은 문장이 이웃에 따라 다른 판정을 받는다 (_workspace/05 §2)
  batch-size: ${AI_BATCH_SIZE:1}
  mock:
    delay-ms: ${AI_MOCK_DELAY_MS:2500}
    fail-keyword: ${AI_MOCK_FAIL_KEYWORD:__FAIL__}

# --- 답변 받기 (UC-08 앞단) — 마스킹본을 Claude에 보내고 답변을 받아 출력 검사에 넘긴다 ---
# 키가 비어 있으면 이 기능은 꺼진다. 화면은 503을 보고 붙여넣기 방식으로 물러난다.
# 나가는 것은 message.submitted_text(마스킹본)뿐이다. 원문은 어떤 경로로도 실리지 않는다.
answer:
  # claude | openai | ollama. 코드는 이 값만 보고 구현을 고른다.
  #   claude → ANTHROPIC_API_KEY
  #   openai → ANSWER_ENDPOINT(예: https://api.openai.com/v1, https://api.groq.com/openai/v1) + ANSWER_API_KEY
  #   ollama → ANSWER_ENDPOINT(예: http://localhost:11434), 키 없음, 외부로 안 나감
  #   비워 두면 endpoint 유무로 정한다 — endpoint 있으면 openai, 없으면 claude. ollama는 명시.
  provider: ${ANSWER_PROVIDER:}
  endpoint: ${ANSWER_ENDPOINT:}
  api-key: ${ANSWER_API_KEY:${ANTHROPIC_API_KEY:}}
  # openai 제공자는 쉼표로 여러 개를 줄 수 있다. 앞이 과부하·할당량이면 다음으로 넘어간다.
  #   예) ANSWER_MODEL=gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.6-flash
  model: ${ANSWER_MODEL:claude-opus-5}
  # Gemini 3.x 같은 생각(thinking) 모델은 OpenAI 호환 경로에서 생각 토큰까지 이 상한에
  # 넣는다. 200으로 시험했더니 답이 한 어절에서 끊겼다. 4096이면 넉넉하고, 실제로 짧게
  # 답하는 모델은 어차피 여기까지 안 쓴다.
  max-tokens: ${ANSWER_MAX_TOKENS:4096}
  # low | medium | high. 채팅 답변은 medium이면 충분하고 low보다 어색한 답이 적다
  effort: ${ANSWER_EFFORT:medium}
  timeout-ms: ${ANSWER_TIMEOUT_MS:60000}

gateway:
  # 입력 규모 상한. 파일 첨부는 프론트에서 텍스트로 추출해 이 경로로 들어오므로(결정 1),
  # 상한 하나가 손 타이핑과 파일 유입을 모두 덮는다.
  #
  # 50,000자는 ConflictResolver.suppressNested가 매칭 개수에 대해 O(n²)인 데서 나온 값이다.
  # 이 길이면 최악의 경우에도 비교가 천만 번대라 P95 3초 안에 들어온다. 시연 파일(약 17,000자)의
  # 약 3배이며, 2,600행짜리 아카이브(약 203,000자)는 검사 전에 거절된다.
  limits:
    max-input-chars: ${GATEWAY_MAX_INPUT_CHARS:50000}
  embargo:
    # 엠바고 만료 판정의 기준일. 비워 두면 실제 오늘이다.
    # 리허설에서 발표 당일(2026-09-04)을 흉내 낼 때만 채운다 — 운영에서는 반드시 비워 둔다.
    reference-date: ${GATEWAY_EMBARGO_REFERENCE_DATE:}
  polling:
    interval-ms: ${GATEWAY_POLL_INTERVAL_MS:2000}   # 202 응답의 pollAfterMs
    max-attempts: ${GATEWAY_POLL_MAX_ATTEMPTS:30}   # FE 폴링 상한
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

logging:
  level:
    com.skala.gateway: DEBUG
