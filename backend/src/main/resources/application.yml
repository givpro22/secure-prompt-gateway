spring:
  application:
    name: gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    # always: 기획서 8.4가 "submittedText": null, "decidedBy": null, "reviewedAt": null 을
    # 명시적으로 싣는다. non_null이면 이 필드들이 응답에서 사라져 FE가 "필드 없음"과 "null"을
    # 구분하는 방어 코드를 쓰게 된다 (계약서 §0 C3)
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}

# --- AI 확장 지점 (기획서 11.3) — 키·모델·지연은 전부 환경변수 ---
ai:
  provider: ${AI_PROVIDER:mock}          # mock | llm
  endpoint: ${AI_ENDPOINT:}              # llm 프로파일에서만 사용
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:}
  temperature: ${AI_TEMPERATURE:0}
  max-tokens: ${AI_MAX_TOKENS:800}
  timeout-ms: ${AI_TIMEOUT_MS:10000}
  max-input-chars: ${AI_MAX_INPUT_CHARS:4000}
  mock:
    delay-ms: ${AI_MOCK_DELAY_MS:2500}
    fail-keyword: ${AI_MOCK_FAIL_KEYWORD:__FAIL__}

gateway:
  # 입력 규모 상한. 파일 첨부는 프론트에서 텍스트로 추출해 이 경로로 들어오므로(결정 1),
  # 상한 하나가 손 타이핑과 파일 유입을 모두 덮는다.
  #
  # 50,000자는 ConflictResolver.suppressNested가 매칭 개수에 대해 O(n²)인 데서 나온 값이다.
  # 이 길이면 최악의 경우에도 비교가 천만 번대라 P95 3초 안에 들어온다. 시연 파일(약 17,000자)의
  # 약 3배이며, 2,600행짜리 아카이브(약 203,000자)는 검사 전에 거절된다.
  limits:
    max-input-chars: ${GATEWAY_MAX_INPUT_CHARS:50000}
  embargo:
    # 엠바고 만료 판정의 기준일. 비워 두면 실제 오늘이다.
    # 리허설에서 발표 당일(2026-09-04)을 흉내 낼 때만 채운다 — 운영에서는 반드시 비워 둔다.
    reference-date: ${GATEWAY_EMBARGO_REFERENCE_DATE:}
  polling:
    interval-ms: ${GATEWAY_POLL_INTERVAL_MS:2000}   # 202 응답의 pollAfterMs
    max-attempts: ${GATEWAY_POLL_MAX_ATTEMPTS:30}   # FE 폴링 상한
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

logging:
  level:
    com.skala.gateway: DEBUG
